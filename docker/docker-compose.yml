version: "3.8"

services:
  # ============================================
  # MONGODB REPLICA SET (3 nodes)
  # ============================================
  mongo1:
    image: mongo:6.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: echo "rs.status().ok" | mongosh --port 27017 --quiet
      interval: 10s
      start_period: 20s

  mongo2:
    image: mongo:6.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:6.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27019"]
    ports:
      - "27019:27019"
    volumes:
      - mongo3_data:/data/db

  mongo-init:
    image: mongo:6.0
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_started
      mongo3:
        condition: service_started
    volumes:
      - ./mongo-setup.sh:/scripts/mongo-setup.sh
    entrypoint: [ "bash", "/scripts/mongo-setup.sh" ]

  # ============================================
  # POSTGRESQL + PGBOUNCER
  # ============================================
  postgresql:
    image: postgres:15
    environment:
      POSTGRES_DB: workly
      POSTGRES_USER: workly
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      - postgresql
    environment:
      DB_USER: workly
      DB_PASSWORD: password
      DB_HOST: postgresql
      DB_NAME: workly
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      AUTH_TYPE: md5
    ports:
      - "6432:5432"

  # ============================================
  # REDIS (Sentinel) - 1 Master, 2 Replicas, 3 Sentinels
  # ============================================
  redis-master:
    image: redis:7.0
    ports:
      - "6379:6379"
    command: ["redis-server", "--port", "6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-1:
    image: redis:7.0
    command: ["redis-server", "--port", "6380", "--replicaof", "redis-master", "6379"]
    ports:
      - "6380:6380"
    depends_on:
      redis-master:
        condition: service_healthy

  redis-replica-2:
    image: redis:7.0
    command: ["redis-server", "--port", "6381", "--replicaof", "redis-master", "6379"]
    ports:
      - "6381:6381"
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel-1:
    image: redis:7.0
    volumes:
      - ./redis-sentinel.conf:/tmp/sentinel-init.conf:ro
    command:
      - sh
      - -c
      - "until redis-cli -h redis-master -p 6379 ping 2>/dev/null | grep -q PONG; do echo 'Waiting for redis-master...'; sleep 1; done && cp /tmp/sentinel-init.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    ports:
      - "26379:26379"
    restart: on-failure
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel-2:
    image: redis:7.0
    volumes:
      - ./redis-sentinel.conf:/tmp/sentinel-init.conf:ro
    command:
      - sh
      - -c
      - "until redis-cli -h redis-master -p 6379 ping 2>/dev/null | grep -q PONG; do echo 'Waiting for redis-master...'; sleep 1; done && cp /tmp/sentinel-init.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    ports:
      - "26380:26379"
    restart: on-failure
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel-3:
    image: redis:7.0
    volumes:
      - ./redis-sentinel.conf:/tmp/sentinel-init.conf:ro
    command:
      - sh
      - -c
      - "until redis-cli -h redis-master -p 6379 ping 2>/dev/null | grep -q PONG; do echo 'Waiting for redis-master...'; sleep 1; done && cp /tmp/sentinel-init.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    ports:
      - "26381:26379"
    restart: on-failure
    depends_on:
      redis-master:
        condition: service_healthy

  # ============================================
  # KAFKA (3 Brokers)
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9094,PLAINTEXT_INTERNAL://kafka1:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      # Local dev: single-broker settings — safe to lose a broker without halting producers
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9095:9095"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9095,PLAINTEXT_INTERNAL://kafka2:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9095,PLAINTEXT_INTERNAL://0.0.0.0:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"

  kafka3:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9096:9096"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9096,PLAINTEXT_INTERNAL://kafka3:29094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9096,PLAINTEXT_INTERNAL://0.0.0.0:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"

  # ============================================
  # ELASTICSEARCH
  # ============================================
  elasticsearch:
    build:
      context: elasticsearch
    image: workly-elasticsearch:custom
    container_name: workly-elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=password
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  # ============================================
  # NGINX LOAD BALANCER
  # ============================================
  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - workly-api

  # ============================================
  # OBSERVABILITY
  # ============================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ============================================
  # WORKLY API (3 Replicas)
  # ============================================
  # To run multiple replicas: docker-compose up --scale workly-api=3
  # (deploy.replicas only works in Docker Swarm, not plain docker-compose)
  workly-api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must be set — see .env.example}
      - SPRING_DATA_MONGODB_URI=mongodb://mongo1:27017,mongo2:27018,mongo3:27019/workly?replicaSet=rs0
      - SPRING_DATA_REDIS_SENTINEL_MASTER=mymaster
      - SPRING_DATA_REDIS_SENTINEL_NODES=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29093,kafka3:29094
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgbouncer:5432/workly
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=workly-api
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      - mongo-init
      - redis-sentinel-1
      - kafka1
      - pgbouncer
      - elasticsearch
      - jaeger

  workly-notification-service:
    build:
      context: ..
      dockerfile: workly-Notification-Service/Dockerfile
    environment:
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must be set — see .env.example}
      - SPRING_DATA_MONGODB_URI=mongodb://mongo1:27017,mongo2:27018,mongo3:27019/workly?replicaSet=rs0
      - SPRING_DATA_REDIS_SENTINEL_MASTER=mymaster
      - SPRING_DATA_REDIS_SENTINEL_NODES=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29093,kafka3:29094
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=workly-notification-service
    ports:
      - "8086:8086"
    depends_on:
      - mongo-init
      - redis-sentinel-1
      - kafka1

  workly-tracking-service:
    build:
      context: ..
      dockerfile: workly-Tracking-Service/Dockerfile
    environment:
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must be set — see .env.example}
      - SPRING_DATA_MONGODB_URI=mongodb://mongo1:27017,mongo2:27018,mongo3:27019/workly?replicaSet=rs0
      - SPRING_DATA_REDIS_SENTINEL_MASTER=mymaster
      - SPRING_DATA_REDIS_SENTINEL_NODES=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=workly-tracking-service
    ports:
      - "8087:8087"
    depends_on:
      - mongo-init
      - redis-sentinel-1

  workly-profile-service:
    build:
      context: ..
      dockerfile: workly-Profile-Service/Dockerfile
    environment:
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must be set — see .env.example}
      - SPRING_DATA_MONGODB_URI=mongodb://mongo1:27017,mongo2:27018,mongo3:27019/workly?replicaSet=rs0
      - SPRING_DATA_REDIS_SENTINEL_MASTER=mymaster
      - SPRING_DATA_REDIS_SENTINEL_NODES=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29093,kafka3:29094
      - SEARCH_SERVICE_URL=http://workly-search-service:8083
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=workly-profile-service
    ports:
      - "8088:8088"
    depends_on:
      - mongo-init
      - redis-sentinel-1
      - kafka1

  workly-matching-service:
    build:
      context: ..
      dockerfile: workly-Matching-Service/Dockerfile
    environment:
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must be set — see .env.example}
      - SPRING_DATA_MONGODB_URI=mongodb://mongo1:27017,mongo2:27018,mongo3:27019/workly?replicaSet=rs0
      - SPRING_DATA_REDIS_SENTINEL_MASTER=mymaster
      - SPRING_DATA_REDIS_SENTINEL_NODES=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=workly-matching-service
    ports:
      - "8089:8089"
    depends_on:
      - mongo-init

  workly-auth-service:
    build:
      context: ..
      dockerfile: workly-Auth-Service/Dockerfile
    environment:
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must be set — see .env.example}
      - SPRING_DATA_MONGODB_URI=mongodb://mongo1:27017,mongo2:27018,mongo3:27019/workly?replicaSet=rs0
      - SPRING_DATA_REDIS_SENTINEL_MASTER=mymaster
      - SPRING_DATA_REDIS_SENTINEL_NODES=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=workly-auth-service
    ports:
      - "8085:8085"
    depends_on:
      - mongo-init
      - redis-sentinel-1

  workly-gateway:
    build:
      context: ..
      dockerfile: workly-Gateway/Dockerfile
    environment:
      - AUTH_SERVICE_URL=http://workly-auth-service:8085
      - NOTIFICATION_SERVICE_URL=http://workly-notification-service:8086
      - TRACKING_SERVICE_URL=http://workly-tracking-service:8087
      - PROFILE_SERVICE_URL=http://workly-profile-service:8088
      - MATCHING_SERVICE_URL=http://workly-matching-service:8089
      - SERVER_URL=http://workly-api:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=workly-gateway
    ports:
      - "8000:8000"
    depends_on:
      - workly-auth-service
      - workly-notification-service
      - workly-tracking-service
      - workly-profile-service
      - workly-matching-service
      - workly-api

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  postgres_data:
  elasticsearch_data:
