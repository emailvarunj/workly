server:
  port: 8000

spring:
  application:
    name: workly-gateway
  cloud:
    gateway:
      routes:
        # Auth Service
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/auth/**

        # Chat Service
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/chat/**,/ws/chat/**

        # Search Service
        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/skills/**,/api/v1/normalization/**

        # Config Service
        - id: config-service
          uri: ${CONFIG_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/config/**,/api/v1/configs/**

        # Profile Service
        - id: profile-service
          uri: ${PROFILE_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/profiles/**

        # Matching Service
        - id: matching-service
          uri: ${MATCHING_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/matching/**

        # Notification Service
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/users/fcm-token

        # Tracking Service
        - id: tracking-service
          uri: ${TRACKING_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/location/**,/ws/tracking/**

        # Main Server (fallback - all other routes)
        - id: server-fallback
          uri: ${SERVER_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/**,/health

      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
            methods: GET
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
